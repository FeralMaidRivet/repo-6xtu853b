##################  MySQL  ##################
mallchat.mysql.ip=127.0.0.1
mallchat.mysql.port=3306
mallchat.mysql.db=mallchat
mallchat.mysql.username=root
mallchat.mysql.password=123456
##################  Redis  ##################
mallchat.redis.host=127.0.0.1
mallchat.redis.port=6379
# 若本机 Redis 没有设置密码，请将下面一行留空：mallchat.redis.password=
mallchat.redis.password=123456
##################  JWT  ##################
mallchat.jwt.secret=mallchat-local-secret-please-change
##################  OSS（本地磁盘存储，已去除 MinIO）  ##################
oss.enabled=true
oss.type=local
# 对外访问域名（含端口），下载/上传地址基于此拼接；本机启动默认端口 8080
oss.domain=http://127.0.0.1:8080
# 文件保存到磁盘的根目录（相对 java -jar 的工作目录）
oss.local-path=./mallchat-files
##################  RocketMQ  ##################
rocketmq.name-server=127.0.0.1:9876
rocketmq.access-key=
rocketmq.secret-key=
##################  GPT / ChatGLM（默认关闭，本地无需）  ##################
mallchat.chatgpt.use=false
mallchat.chatgpt.uid=10001
mallchat.chatgpt.key=sk-local-disabled
mallchat.chatgpt.proxyUrl=https://api.openai.com
mallchat.chatglm2.use=false
mallchat.chatglm2.url=http://127.0.0.1:8000
mallchat.chatglm2.uid=10002
